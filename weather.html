<!doctype html>
<html lang="en" data-theme="dark" class="kt-js">
<head>
      <meta charset="utf-8">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('gi-theme')==='light'?'light':'dark'}catch(e){}</script>
  <!-- kt:share-meta -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Keeper Trade">
  <meta property="og:title" content="Weather Center">
  <meta property="og:description" content="Kickoff weather for every NFL game, Thursday to Monday, any week.">
  <meta property="og:url" content="https://keeper-trade.pages.dev/weather.html">
  <meta property="og:image" content="https://keeper-trade.pages.dev/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Keeper Trade: your edge on draft day and every trade.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://keeper-trade.pages.dev/assets/og-image.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Keeper Trade">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- /kt:share-meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <meta name="description" content="Thursday-to-Monday kickoff weather for every NFL game: wind, rain, snow, and cold, with fantasy impact flags and your players highlighted.">
  <title>Weather Center — Keeper Trade</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/weather.css">
  <link rel="stylesheet" href="css/weather-center.css">
</head>
<body>
  <main class="wx-shell">
    <header class="wx-heading">
      <div><span class="kt-eyebrow">Thursday to Monday · every kickoff</span><h1>WEATHER CENTER</h1><p>Wind, rain, snow, and cold at kickoff for every game, flagged for fantasy impact.</p></div>
    </header>
    <section class="wx-controls" aria-label="Weather filters">
      <label>Week<select id="wx-week" aria-label="NFL week"></select></label>
      <label>Game<select id="wx-game" aria-label="Show one game or all games"><option value="all">All games</option></select></label>
      <label id="wx-manager-wrap" hidden>Your team<select id="wx-manager" aria-label="Highlight players from this team"></select></label>
      <div class="wx-filters" role="group" aria-label="Filter games">
        <button class="kt-chip" type="button" data-wx-filter="all" aria-pressed="true">All</button>
        <button class="kt-chip" type="button" data-wx-filter="outdoor" aria-pressed="false">Outdoor</button>
        <button class="kt-chip" type="button" data-wx-filter="impact" aria-pressed="false">Weather impact</button>
        <button class="kt-chip" type="button" data-wx-filter="mine" aria-pressed="false">Your players</button>
      </div>
    </section>
    <p class="wx-status" id="wx-status" role="status" aria-live="polite">Loading this week…</p>
    <section class="wx-summary" id="wx-summary" aria-label="Week summary"></section>
    <div class="wx-board" id="wx-board" aria-busy="true" aria-live="polite"></div>
    <footer class="wx-footer"><a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo.com</a><span>Forecasts open about 15 days before kickoff. Completed games show recorded conditions.</span></footer>
  </main>
  <script type="module" src="js/features/weather-center.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
