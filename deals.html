<body>
  <main class="dl-shell">
    <header class="dl-heading">
      <span class="kt-eyebrow" id="dl-eyebrow">Real trades · your league</span>
      <h1>DEALS</h1>
      <p>Every real trade in your league. Call who came out ahead, then see the model’s read with today’s values, what each side has scored since, and how your calls hold up.</p>
      <p class="dl-status" id="dl-status" role="status" aria-live="polite">Loading your league’s trades…</p>
    </header>
    <div class="dl-tabs" role="tablist" aria-label="Deals sections" hidden>
      <button role="tab" type="button" data-tab="call" id="dl-tab-call" aria-controls="dl-panel-call" aria-selected="true">Call it</button>
      <button role="tab" type="button" data-tab="database" id="dl-tab-database" aria-controls="dl-panel-database" aria-selected="false" tabindex="-1">Database</button>
      <button role="tab" type="button" data-tab="market" id="dl-tab-market" aria-controls="dl-panel-market" aria-selected="false" tabindex="-1">Market</button>
      <button role="tab" type="button" data-tab="teams" id="dl-tab-teams" aria-controls="dl-panel-teams" aria-selected="false" tabindex="-1">Teams</button>
      <button role="tab" type="button" data-tab="binder" id="dl-tab-binder" aria-controls="dl-panel-binder" aria-selected="false" tabindex="-1">Binder</button>
      <button role="tab" type="button" data-tab="record" id="dl-tab-record" aria-controls="dl-panel-record" aria-selected="false" tabindex="-1">Your record</button>
    </div>
    <section role="tabpanel" id="dl-panel-call" aria-labelledby="dl-tab-call" tabindex="0"><div class="dl-skel"><span class="kt-skeleton"></span><span class="kt-skeleton"></span></div></section>
    <section role="tabpanel" id="dl-panel-database" aria-labelledby="dl-tab-database" tabindex="0" hidden></section>
    <section role="tabpanel" id="dl-panel-market" aria-labelledby="dl-tab-market" tabindex="0" hidden></section>
    <section role="tabpanel" id="dl-panel-teams" aria-labelledby="dl-tab-teams" tabindex="0" hidden></section>
    <section role="tabpanel" id="dl-panel-binder" aria-labelledby="dl-tab-binder" tabindex="0" hidden></section>
    <section role="tabpanel" id="dl-panel-record" aria-labelledby="dl-tab-record" tabindex="0" hidden></section>
